[project]
name = "actividad2-fastapi-finanzas-data-guardians"
version = "0.1.0"
description = "API financiera educativa con FastAPI, yfinance, Machine Learning y Docker."
authors = [
    { name = "Martha Forero" },
    { name = "Maria Beltran" }
]
readme = "README.md"
requires-python = ">=3.12,<3.15"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "yfinance>=0.2,<1.0",
    "pandas>=2.2,<3.0",
    "numpy>=2.0,<3.0",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.4,<2.0"
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.poetry]
package-mode = false